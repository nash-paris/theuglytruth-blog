name: Build & Deploy blog

# La synchronisation Substack ne tourne PLUS sur GitHub Actions : les
# endpoints /api/v1/archive et /feed renvoient 403 depuis les IP datacenter
# des runners. Le sync est execute ailleurs (sandbox Cowork) puis pousse ici.
# Ce workflow se contente donc de builder + deployer le contenu pousse.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/**'
      - 'README.md'

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Astro
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## Blog theuglytruth: build & deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Editions publiees : $(ls src/content/blog/*.md 2>/dev/null | grep -v README | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "Blog : https://theuglytruth.fr" >> $GITHUB_STEP_SUMMARY
